name: Deploy Docs

# Builds the mkdocs site and deploys it to GitHub Pages.
#
# One-time setup required before this workflow can deploy: in the repo
# Settings -> Pages -> "Build and deployment" -> Source, switch it from
# "Deploy from a branch" to "GitHub Actions". Until that switch is made,
# this workflow will build the site successfully but the deploy job will
# fail (Pages is still serving from the legacy `documentation` branch).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs "mkdocstrings[python]"

      # mkdocstrings imports the package to pull in its docstrings, so
      # `python -m mkdocs` (not the bare `mkdocs` entry point) is used to
      # make sure the repo root (and therefore `src/`) is on sys.path.
      - name: Build site
        run: python -m mkdocs build --site-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
