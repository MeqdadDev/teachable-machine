name: Publish to PyPI

# Triggered when a GitHub Release is published (create a Release from a
# version tag, e.g. v1.3.0). Uses PyPI Trusted Publishing (OIDC) — no
# API token needs to be stored as a secret.
#
# One-time setup required on PyPI before this workflow can publish:
#   https://pypi.org/manage/project/teachable_machine/settings/publishing/
#   Add a trusted publisher with:
#     Owner:      MeqdadDev
#     Repository: teachable-machine
#     Workflow:   publish.yml
#     Environment: pypi
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/teachable_machine/
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
